<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0e">
<title>Voice Line</title>
<style>
  :root { --bg:#0b0b0e; --text:#ececf0; --muted:#80808c; --accent:#B60232; --glow:#ff2d5a; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
      -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font:16px/1.4 system-ui, -apple-system, sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:28px; padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
           touch-action:none; }
  #orb { width:min(52vw, 260px); aspect-ratio:1; border-radius:50%;
         background:radial-gradient(circle at 50% 45%, #ff4d72 0%, var(--accent) 45%, #3a0010 100%);
         box-shadow:0 0 40px 4px rgba(182,2,50,.35); transition:transform .08s linear, box-shadow .3s, filter .3s; }
  #orb.idle { filter:saturate(.55) brightness(.7); }
  #orb.listening { box-shadow:0 0 70px 18px rgba(255,45,90,.55); }
  #orb.thinking { animation:breathe 1.6s ease-in-out infinite; }
  #orb.locked { filter:grayscale(1) brightness(.5); }
  @keyframes breathe { 50% { transform:scale(.93); filter:brightness(.8); } }
  #status { font-weight:700; letter-spacing:.14em; font-size:13px; color:var(--muted); text-transform:uppercase;
            text-align:center; min-height:20px; }
  #hint { color:var(--muted); font-size:15px; text-align:center; max-width:340px; min-height:42px; }
  #log { position:fixed; left:0; right:0; bottom:0; max-height:32vh; overflow:hidden; padding:12px 16px
         calc(12px + env(safe-area-inset-bottom)); font-size:14px; color:#b9b9c4;
         background:linear-gradient(transparent, rgba(11,11,14,.95) 30%); pointer-events:none; }
  #log p { margin:4px 0; }
  #log b { color:var(--glow); font-weight:600; }
  #bye { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:3; font:700 12px system-ui;
         letter-spacing:.12em; color:var(--muted); background:transparent; border:1px solid #2c2c35;
         border-radius:99px; padding:8px 12px; display:none; }
  #gate { position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center;
          background:var(--bg); }
  #gate button { font:800 18px system-ui; letter-spacing:.1em; color:#fff; background:var(--accent);
                 border:0; border-radius:14px; padding:20px 34px; }
  #pad { position:fixed; inset:0; z-index:4; display:none; flex-direction:column; align-items:center;
         justify-content:center; gap:22px; background:var(--bg);
         padding:env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom)); }
  #pad.on { display:flex; }
  #dots { display:flex; gap:14px; min-height:16px; }
  #dots i { width:12px; height:12px; border-radius:50%; background:#2c2c35; }
  #dots i.full { background:var(--glow); box-shadow:0 0 12px 2px rgba(255,45,90,.5); }
  #keys { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; width:min(78vw, 300px); }
  #keys button { font:600 26px system-ui; color:var(--text); background:#15151b; border:1px solid #2c2c35;
                 border-radius:16px; padding:18px 0; }
  #keys button:active { background:var(--accent); color:#fff; }
  #keys button.wide { font:700 14px system-ui; letter-spacing:.1em; color:var(--muted); }
  #padmsg { color:var(--muted); font-size:14px; text-align:center; min-height:20px; }
  #padmsg.bad { color:var(--glow); }
  #ask { position:fixed; left:0; right:0; bottom:0; z-index:6; display:none;
         padding:22px 18px calc(22px + env(safe-area-inset-bottom));
         background:#15151b; border-top:1px solid var(--accent);
         box-shadow:0 -18px 40px rgba(0,0,0,.6); }
  #ask.on { display:block; }
  #asklabel { font:700 11px system-ui; letter-spacing:.16em; color:var(--muted);
              text-transform:uppercase; margin-bottom:8px; }
  #asktext { font-size:19px; line-height:1.35; margin-bottom:18px; }
  #askrow { display:flex; gap:12px; }
  #askrow button { flex:1; font:800 16px system-ui; letter-spacing:.06em; border:0;
                   border-radius:14px; padding:18px 0; color:#fff; }
  #yes { background:var(--accent); }
  #no  { background:#2c2c35; color:var(--text); }
  #askrow button:active { filter:brightness(1.35); }
</style>
</head>
<body>
<div id="gate"><button id="start">START VOICE LINE</button></div>
<button id="bye">SIGN OFF</button>
<div id="stage">
  <div id="orb" class="idle"></div>
  <div id="status">Connecting</div>
  <div id="hint"></div>
</div>
<div id="pad">
  <div id="dots"></div>
  <div id="keys">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="wide" data-k="clear">CLEAR</button>
    <button data-k="0">0</button>
    <button class="wide" data-k="enter">ENTER</button>
  </div>
  <div id="padmsg">Enter your PIN</div>
</div>
<div id="ask">
  <div id="asklabel">Needs your OK</div>
  <div id="asktext"></div>
  <div id="askrow"><button id="no">NO</button><button id="yes">YES</button></div>
</div>
<div id="log"></div>
<script>
const $ = (id) => document.getElementById(id);
let ws, ctx, stream, rec, chunks = [], authed = false, lockedUntil = 0, name = "Janice";
let nextTime = 0, sources = [], holding = false, retry = 0, analyser, levelBuf;

function setStatus(s, hint) {
  $("status").textContent = s;
  if (hint !== undefined) $("hint").textContent = hint;
}
function orb(cls) { $("orb").className = cls; }
function idleHint() {
  if (Date.now() < lockedUntil) return;
  if (!authed) setStatus("Locked", "Enter your PIN to unlock.");
  else setStatus("Ready", `Hold anywhere to talk to ${name}.`);
}

// ---------- transcript ----------
const lines = [];
function addLine(who, text, append) {
  if (append && lines.length && lines[lines.length - 1].who === who) lines[lines.length - 1].text += " " + text;
  else lines.push({ who, text });
  while (lines.length > 6) lines.shift();
  $("log").innerHTML = lines.map(l => `<p><b>${l.who === "YOU" ? "You" : esc(l.who)}:</b> ${esc(l.text)}</p>`).join("");
}
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- her voice ----------
function playPcm(buf) {
  const rate = new DataView(buf).getUint32(0, true);
  const pcm = new Int16Array(buf, 4);
  const ab = ctx.createBuffer(1, pcm.length, rate);
  const ch = ab.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
  const src = ctx.createBufferSource();
  src.buffer = ab; src.connect(analyser);
  const t = Math.max(ctx.currentTime + 0.06, nextTime);
  src.start(t); nextTime = t + ab.duration;
  sources.push(src);
  src.onended = () => { sources = sources.filter(s => s !== src); };
}
function flush() {
  sources.forEach(s => { try { s.stop(); } catch (e) {} });
  sources = []; nextTime = 0;
}
function pulse() {   // the orb breathes with her voice
  if (analyser) {
    analyser.getFloatTimeDomainData(levelBuf);
    let sum = 0; for (const v of levelBuf) sum += v * v;
    const lvl = Math.min(1, Math.sqrt(sum / levelBuf.length) * 6);
    if ($("orb").className === "speaking") $("orb").style.transform = `scale(${1 + lvl * 0.18})`;
    else if ($("orb").className !== "thinking") $("orb").style.transform = "";
  }
  requestAnimationFrame(pulse);
}

// ---------- the keypad gate ----------
let pin = "";
const PIN_MAX = 10;
function drawPin() {
  $("dots").innerHTML = Array.from(pin, () => '<i class="full"></i>').join("");
}
function padMsg(text, bad) {
  $("padmsg").textContent = text;
  $("padmsg").className = bad ? "bad" : "";
}
function showPad(on) {
  $("pad").className = on ? "on" : "";
  if (on) { pin = ""; drawPin(); }
}
function sendPin() {
  if (pin.length < 4 || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ t: "pin", data: pin }));
  pin = ""; drawPin(); padMsg("Checking...");
}
$("keys").addEventListener("click", (e) => {
  const k = e.target.dataset && e.target.dataset.k;
  if (!k || Date.now() < lockedUntil) return;
  if (navigator.vibrate) navigator.vibrate(10);
  if (k === "clear") { pin = ""; drawPin(); padMsg("Enter your PIN"); return; }
  if (k === "enter") { sendPin(); return; }
  if (pin.length < PIN_MAX) { pin += k; drawPin(); }
  if (pin.length === PIN_MAX) sendPin();
});

// ---------- a permission ask, answered with a thumb ----------
// The buttons send plain words on the same channel a typed line uses,
// so the PC's gate still decides. Holding the orb and saying yes works
// exactly as before -- this is a shortcut, not a second authority.
function showAsk(text) {
  if (text) {
    $("asktext").textContent = text;
    $("ask").className = "on";
    if (navigator.vibrate) navigator.vibrate([12, 60, 12]);
  } else {
    $("ask").className = "";
  }
}
function answerAsk(word) {
  if (ws.readyState === 1) ws.send(JSON.stringify({ t: "answer", data: word }));
  showAsk(null);
  setStatus("Sending", "");
}
$("yes").onclick = () => answerAsk("yes");
$("no").onclick = () => answerAsk("no");

// ---------- socket ----------
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    retry = 0;
    const tok = sessionStorage.getItem("vl_token");
    if (tok) ws.send(JSON.stringify({ t: "auth", token: tok }));
  };
  ws.onmessage = (ev) => {
    if (typeof ev.data !== "string") { playPcm(ev.data); return; }
    const m = JSON.parse(ev.data), d = m.data;
    switch (m.t) {
      case "hello":
        name = d.name; authed = false; $("bye").style.display = "none";
        showPad(true); showAsk(null);
        if (d.locked) lock(d.locked); else { idleHint(); padMsg("Enter your PIN"); }
        if (!d.has_passcode) { showPad(false); setStatus("Not set up", "No PIN is set on the PC yet."); }
        break;
      case "auth":
        if (d.ok) {
          authed = true; $("bye").style.display = "block"; showPad(false);
          if (d.token) sessionStorage.setItem("vl_token", d.token);
          setStatus("Unlocked", `Hold anywhere to talk to ${name}.`);
        } else {
          sessionStorage.removeItem("vl_token"); authed = false; showPad(true);
          if (d.left !== undefined) {
            setStatus("Wrong PIN", `${d.left} ${d.left === 1 ? "try" : "tries"} left.`);
            padMsg(`Wrong PIN - ${d.left} ${d.left === 1 ? "try" : "tries"} left.`, true);
          } else { idleHint(); padMsg("Enter your PIN"); }
        }
        break;
      case "ask": showAsk(d); break;
      case "locked": showAsk(null); lock(d); break;
      case "state":
        if (!holding) {
          orb(d === "speaking" ? "speaking" : d === "thinking" ? "thinking" : "idle");
          if (d === "thinking") setStatus("Thinking", "");
          else if (d === "speaking") setStatus("Speaking", "Touch to interrupt.");
          else if (authed) idleHint();
        }
        break;
      case "transcript": addLine(d.speaker, d.text, d.append); break;
      case "heard": break;   // the transcript event carries it
      case "flush": flush(); break;
      case "notice": setStatus(authed ? "Ready" : "Locked", d); break;
    }
  };
  ws.onclose = () => {
    setStatus("Reconnecting", "");
    setTimeout(connect, Math.min(8000, 500 * 2 ** retry++));
  };
}
function lock(secs) {
  lockedUntil = Date.now() + secs * 1000; orb("locked");
  const mins = Math.ceil(secs / 60);
  const wait = `Too many wrong PINs. Try again in ${mins} minute${mins === 1 ? "" : "s"}.`;
  setStatus("Locked out", wait); padMsg(wait, true);
  setTimeout(() => { orb("idle"); idleHint(); padMsg("Enter your PIN"); }, secs * 1000);
}

// ---------- hold to talk ----------
const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
function down(e) {
  e.preventDefault();
  if (holding || !authed || !stream || ws.readyState !== 1 || Date.now() < lockedUntil) return;
  holding = true;
  ws.send(JSON.stringify({ t: "press" })); flush();
  chunks = [];
  rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  rec.ondataavailable = (ev) => { if (ev.data.size) chunks.push(ev.data); };
  rec.onstop = async () => {
    const blob = new Blob(chunks, { type: rec.mimeType });
    if (blob.size > 0 && ws.readyState === 1) ws.send(await blob.arrayBuffer());
  };
  rec.start();
  orb("listening"); setStatus("Listening", "Let go to send.");
  if (navigator.vibrate) navigator.vibrate(15);
}
function up(e) {
  e.preventDefault();
  if (!holding) return;
  holding = false;
  if (rec && rec.state !== "inactive") rec.stop();
  orb("thinking"); setStatus("Sending", "");
}
const stage = $("stage");
stage.addEventListener("pointerdown", down);
stage.addEventListener("pointerup", up);
stage.addEventListener("pointercancel", up);
stage.addEventListener("pointerleave", up);
stage.addEventListener("contextmenu", (e) => e.preventDefault());

$("bye").onclick = () => {
  if (ws.readyState === 1) ws.send(JSON.stringify({ t: "bye" }));
  sessionStorage.removeItem("vl_token"); authed = false; flush(); showPad(true); showAsk(null);
};

// Browsers only allow the mic and audio after a real tap, so one tap opens both.
$("start").onclick = async () => {
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    analyser = ctx.createAnalyser(); analyser.fftSize = 512;
    levelBuf = new Float32Array(analyser.fftSize);
    analyser.connect(ctx.destination);
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    try { await navigator.wakeLock?.request("screen"); } catch (e) {}
    $("gate").style.display = "none";
    connect(); pulse();
  } catch (e) {
    $("start").textContent = "MIC BLOCKED - CHECK PERMISSIONS";
  }
};
</script>
</body>
</html>
